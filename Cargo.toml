[workspace]
members = [".", "bench/axum-te", "bench/actix-te"]
resolver = "2"

[package]
name = "strada"
version = "0.1.0"
edition = "2021"
description = "A small, fast HTTP backend framework on Tokio + Hyper 1.x"
license = "MIT OR Apache-2.0"
repository = "https://github.com/6t9xstar/strada"
readme = "README.md"
keywords = ["http", "web", "framework", "hyper", "async"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]
exclude = ["bench/results/", "/.github"]
rust-version = "1.85"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "server-graceful"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
serde = "1"
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
http = "1"

[[bench]]
name = "router"
harness = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[profile.bench]
codegen-units = 1
lto = "fat"
